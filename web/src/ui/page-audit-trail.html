  <div class="page-view" id="page-audit-trail">
    <div class="container-fluid px-0" style="width:100%">

      <div class="wl-summary-row" style="grid-template-columns:repeat(4,1fr)">
        <div class="wl-summary-card"><div class="wl-summary-title">Events</div><div class="fa-stat-val" id="auSumTotal">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Refused</div><div class="fa-stat-val" id="auSumDenied">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Actors</div><div class="fa-stat-val" id="auSumActors">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Newest</div><div class="fa-stat-val" id="auSumNewest">&mdash;</div></div>
      </div>

      <div class="card" id="auditCard">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Audit Trail</h3>
            <span id="auditBadge" class="card-badge">0</span>
            <span id="auditNote" class="muted-note"></span>
          </div>
          <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
            <select class="form-select form-select-sm" id="auActor" style="width:150px;flex:0 0 auto;font-size:.74rem" aria-label="Actor filter">
              <option value="">All actors</option>
            </select>
            <select class="form-select form-select-sm" id="auAction" style="width:170px;flex:0 0 auto;font-size:.74rem" aria-label="Action filter">
              <option value="">All actions</option>
            </select>
            <select class="form-select form-select-sm" id="auOutcome" style="width:130px;flex:0 0 auto;font-size:.74rem" aria-label="Outcome filter">
              <option value="">All outcomes</option>
              <option value="ok">Succeeded</option>
              <option value="denied">Refused</option>
              <option value="failed">Failed</option>
            </select>
            <input id="auSearch" class="form-control form-control-sm" placeholder="Search target or detail&hellip;" style="flex:0 1 220px;width:220px"/>
            <a id="auCsvLink" class="btn btn-sm btn-outline-secondary" href="#">CSV</a>
            <a id="auPdfLink" class="btn btn-sm btn-outline-secondary" href="#">PDF</a>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="data-scroll" style="max-height:calc(100vh - 330px);overflow-y:auto">
            <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:960px">
              <colgroup><col style="width:13%"><col style="width:11%"><col style="width:11%"><col style="width:15%">
                        <col style="width:16%"><col style="width:9%"><col style="width:25%"></colgroup>
              <thead><tr id="auditThead"></tr></thead>
              <tbody id="auditTable">
                <tr><td colspan="7" class="empty-state">Waiting for audit data&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2" style="margin-top:.6rem">
        <button id="auPrev" class="btn btn-sm btn-outline-secondary">&larr; Newer</button>
        <span id="auPageLbl" class="muted-note"></span>
        <button id="auNext" class="btn btn-sm btn-outline-secondary">Older &rarr;</button>
      </div>

    </div>
  </div>
