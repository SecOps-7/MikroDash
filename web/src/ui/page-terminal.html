  <!-- The Terminal page: type a RouterOS console line, read the device's own
       answer. The server runs it through `/execute ... as-string=yes` and sends
       the console text back verbatim; web/src/pages/terminal.ts renders it as
       TEXT NODES and never as markup.

       THE PROMPT LIVES INSIDE THE SCROLLBACK, as its last child, and
       terminal.ts moves it back there after every write. That is the whole of
       what makes this read as a terminal rather than a log with a search box:
       you type where the output stopped, the caret scrolls with the content,
       and there is no second region with a border of its own.

       BARE ON PURPOSE - no count pill, no tab strip, no sortable headers, no
       coloured pills. That furniture exists to make a table of device rows
       legible and this page has no rows; the exception is recorded in
       CLAUDE.md's "A new page's furniture" so it reads as a decision rather
       than an omission. -->
  <div class="page-view" id="page-terminal">
    <div class="container-fluid px-0" style="width:100%">
      <div class="card" id="terminalCard">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Terminal</h3>
          </div>
          <div class="hdr-actions">
            <span class="term-status" id="terminalStatus"></span>
            <button id="terminalStop" class="sbtn sbtn-danger" type="button" hidden
                    title="Stop waiting for this command. Ctrl-C does the same.">Stop</button>
            <button id="terminalClear" class="sbtn sbtn-ghost" type="button"
                    title="Clear the pane. The device is not touched.">Clear</button>
          </div>
        </div>
        <div class="card-body p-0">
          <!-- Filled only by createElement and textContent in terminal.ts: the
               text is the device's, and an interface name could otherwise
               inject markup (0.7.35). -->
          <div id="terminalScroll" class="term-scroll data-scroll"
               role="log" aria-live="polite" aria-label="Device console output">
            <div class="term-live" id="terminalLive">
              <span class="term-prompt" id="terminalPrompt">&gt;</span>
              <input id="terminalInput" class="term-input" type="text" autocomplete="off"
                     autocapitalize="off" autocorrect="off" spellcheck="false"
                     aria-label="RouterOS command" disabled>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
