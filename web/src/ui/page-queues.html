  <div class="page-view" id="page-queues">
    <div class="container-fluid px-0" style="width:100%">

      <div class="wl-summary-row wl-summary-row-4">
        <div class="wl-summary-card"><div class="wl-summary-title">Simple Queues</div><div class="fa-stat-val" id="qSumSimple">-</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Tree Queues</div><div class="fa-stat-val" id="qSumTree">-</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Shaping Now</div><div class="fa-stat-val" id="qSumActive">-</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Total Shaped</div><div class="fa-stat-val" id="qSumBytes" style="font-size:1.1rem">-</div></div>
      </div>

      <!-- FastTrack swallows the traffic simple queues are meant to shape, so a
           queue can look configured and do nothing. Rendered only when at least
           one enabled queue is actually affected. -->
      <div id="qFtCard" style="display:none;margin-bottom:.85rem"><div class="q-ftbanner" id="qFtBanner"></div></div>
      <div id="qNoticeCard" style="display:none;margin-bottom:.85rem"><div class="q-ftbanner q-ft-unknown" id="qNotice"></div></div>

      <div class="card" id="queuesCard">
        <div class="stale-overlay">&#9679; stale</div>
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="stab-bar brtab-bar" id="qTabBar" role="tablist" aria-label="Queue tables">
            <button class="stab active" data-qtab="simple" role="tab" aria-selected="true"
                    aria-controls="qtab-simple" id="qTabBtn-simple">Simple
              <span id="qSimpleBadge" class="card-badge">0</span></button>
            <button class="stab" data-qtab="tree" role="tab" aria-selected="false"
                    aria-controls="qtab-tree" id="qTabBtn-tree">Tree
              <span id="qTreeBadge" class="card-badge">0</span></button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span id="qActionNote" class="muted-note"></span>
            <input id="qSearch" class="form-control form-control-sm"
                   placeholder="Search&hellip;" style="flex:0 1 200px;width:200px"/>
            <!-- The resource engine fills this with the Add button for the table on
                 screen; queues.ts re-points it when the tab changes. -->
            <span id="qAddSlot" data-res-add="simpleQueue"></span>
          </div>
        </div>
        <div class="card-body p-0">

          <div class="brtab-panel active" id="qtab-simple" role="tabpanel" aria-labelledby="qTabBtn-simple">
            <div class="data-scroll" style="max-height:calc(100vh - 440px);overflow-y:auto">
              <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:1000px">
                <colgroup><col style="width:4%"><col style="width:17%"><col style="width:15%"><col style="width:16%">
                          <col style="width:22%"><col style="width:26%"></colgroup>
                <thead><tr id="qSimpleThead"></tr></thead>
                <tbody id="qSimpleTable" data-res-rows="simpleQueue">
                  <tr><td colspan="6" class="empty-state">Waiting for queue data&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="brtab-panel" id="qtab-tree" role="tabpanel" aria-labelledby="qTabBtn-tree">
            <div class="data-scroll" style="max-height:calc(100vh - 440px);overflow-y:auto">
              <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:940px">
                <colgroup><col style="width:18%"><col style="width:14%"><col style="width:16%"><col style="width:14%">
                          <col style="width:18%"><col style="width:20%"></colgroup>
                <thead><tr id="qTreeThead"></tr></thead>
                <tbody id="qTreeTable" data-res-rows="queueTree">
                  <tr><td colspan="6" class="empty-state">Waiting for queue data&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
