  <div class="page-view" id="page-firewall">
    <div class="container-fluid px-0" style="width:100%">

      <!-- Summary row -->
      <div class="fw-summary-row">

        <!-- Rule Counts -->
        <div class="fw-scard" style="display:flex;flex-direction:column">
          <div class="fw-scard-title">Rule Counts</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center">
            <div style="display:flex;gap:1.2rem;align-items:center;justify-content:center">
              <div style="display:flex;flex-direction:column;align-items:center;gap:.15rem">
                <span class="fw-rc-num" id="fwCntFilter">-</span>
                <span class="fw-rc-dis" id="fwCntFilterDis"></span>
                <span class="fw-rc-lbl">Filter</span>
              </div>
              <div class="fw-rc-divider"></div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:.15rem">
                <span class="fw-rc-num" id="fwCntNat">-</span>
                <span class="fw-rc-dis" id="fwCntNatDis"></span>
                <span class="fw-rc-lbl">NAT</span>
              </div>
              <div class="fw-rc-divider"></div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:.15rem">
                <span class="fw-rc-num" id="fwCntMangle">-</span>
                <span class="fw-rc-dis" id="fwCntMangleDis"></span>
                <span class="fw-rc-lbl">Mangle</span>
              </div>
              <div class="fw-rc-divider"></div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:.15rem">
                <span class="fw-rc-num" id="fwCntRaw">-</span>
                <span class="fw-rc-dis" id="fwCntRawDis"></span>
                <span class="fw-rc-lbl">Raw</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Breakdown -->
        <div class="fw-scard">
          <div class="fw-scard-title">Action Breakdown</div>
          <div class="fw-action-list" id="fwActionList">
            <div class="fw-action-row"><span class="fw-action-name" style="color:var(--text-muted)">-</span></div>
          </div>
        </div>

        <!-- Chain Count -->
        <div class="fw-scard" style="display:flex;flex-direction:column">
          <div class="fw-scard-title">Chain Count</div>
          <div id="fwChainCount" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
        </div>

      </div>

      <!-- Rules card -->
      <div class="card" id="firewallCard">
        <div class="stale-overlay">&#9679; stale</div>
        <div class="card-body p-0">
          <!-- The address-family switch, ABOVE the four table tabs, so the page
               reads "which firewall, then which table" rather than eight tabs in
               a row. Follows the Routing page's .stab-bar pattern (role=tablist,
               aria-selected, arrow keys) rather than the .fw-tab divs below it,
               which carry no ARIA at all - a deliberate inconsistency: converting
               those is a separate change with a much wider blast radius, and half
               a fix here would read as thoroughness.

               `hidden` until the router answers. `ipv6Disabled` has THREE states
               and this bar shows only on a definite false; nil means the probe
               has not run and the page must change nothing. -->
          <div class="stab-bar fwfam-bar" id="fwFamBar" role="tablist" aria-label="Address family" hidden>
            <button type="button" class="stab active" data-fwfam="ip4" role="tab"
                    aria-selected="true" aria-controls="fwRulesPanel" id="fwFamBtn-ip4">IPv4</button>
            <button type="button" class="stab" data-fwfam="ip6" role="tab"
                    aria-selected="false" aria-controls="fwRulesPanel" id="fwFamBtn-ip6">IPv6</button>
          </div>
          <div class="fw-tabs">
            <div class="fw-tab active" data-fw="filter">Filter</div>
            <div class="fw-tab" data-fw="nat">NAT</div>
            <div class="fw-tab" data-fw="mangle">Mangle</div>
            <div class="fw-tab" data-fw="raw">Raw</div>
            <!-- Which resource this means follows the active tab: app.js rewrites
                 data-res-add and fires mikrodash:resmount. data-res-add-dynamic
                 declares the whole range it can become, so the mount is
                 greppable and a resource reachable only after a tab change is
                 still visibly mounted. -->
            <span data-res-add="fwFilter"
                  data-res-add-dynamic="fwFilter,fwNat,fwMangle,fwRaw,fwFilter6,fwNat6,fwMangle6,fwRaw6"></span>
          </div>
          <div class="fw-search-wrap">
            <input id="fwSearch" type="text" placeholder="Search chain, action, address, comment…" autocomplete="off" spellcheck="false">
            <!-- Off by default, and remembered per browser. Hidden alongside the
                 family bar: a checkbox offering to add data that does not exist
                 is a lie. A bare label+checkbox rather than .stoggle, which is a
                 space-between form row and would need overriding to sit in a
                 toolbar. -->
            <label class="fw-v6-toggle" id="fwShowV6Label" hidden
                   title="Fold the IPv6 rules into Rule Counts, Action Breakdown and Chain Count">
              <input type="checkbox" id="fwShowV6"> Show IPv6 in cards
            </label>
          </div>
          <div class="table-responsive" id="fwRulesPanel" role="tabpanel" aria-labelledby="fwFamBtn-ip4">
            <table class="table table-vcenter mb-0">
              <thead><tr><th class="fw-dragcell"></th><th class="fw-movecell"></th><th class="fw-pos" title="Position in the chain - a rule below the final drop never runs">#</th><th>Chain</th><th>Action</th><th>Src &#8594; Dst</th><th>Comment</th><th class="text-end">Packets</th><th class="text-end">Bytes</th></tr></thead>
              <tbody id="firewallTable" data-res-rows="fwFilter"><tr><td colspan="9" class="empty-state">Waiting&#8230;</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
