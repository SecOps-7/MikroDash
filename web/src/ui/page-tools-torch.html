  <!-- The Torch page: one interface's live flows. It needs WRITE access on this
       page - torch loads the router's CPU while it watches - and the run is
       audited. Rendered by web/src/pages/tools.ts. -->
  <div class="page-view" id="page-tools-torch">
    <div class="container-fluid px-0" style="width:100%">
      <div class="card" id="toolsTorchCard">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Torch</h3>
            <span id="torchBadge" class="card-badge" title="Flows shown">0</span>
          </div>
        </div>
        <div class="card-body">
          <form class="d-flex align-items-end flex-wrap gap-2 mb-3" id="torchForm">
            <div>
              <label class="form-label" for="torchInterface">Interface</label>
              <select class="form-select form-select-sm" id="torchInterface" required></select>
            </div>
            <div>
              <label class="form-label" for="torchSeconds">Seconds</label>
              <select class="form-select form-select-sm" id="torchSeconds">
                <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                <option>15</option><option>20</option><option>30</option><option>45</option><option>60</option>
                <option value="continuous">Continuous torch</option>
              </select>
            </div>
            <button class="sbtn sbtn-primary" id="torchRun" type="submit">Watch</button>
            <span class="muted-note" id="torchStatus"></span>
          </form>
          <!-- ── THE FIVE CARDS (tools-torch-cards.ts) ────────────────────
               Rx and Tx are the INTERFACE's totals, which cover every flow
               including the quieter ones cut from the table below, so they do
               not match adding the rows up on a busy link. Top protocol and
               Top talker are folded in Go over the same full set, for the same
               reason - see TorchResult in internal/diag/torch.go.

               Five rather than the four every other tool page shows, by
               request. The grid is auto-fit, so they wrap rather than crush. -->
          <div class="tool-cards" id="torchCards">
            <div class="tool-card tool-card-rx"><div class="tool-card-label">Rx</div>
              <div class="tool-card-value"><span id="torchRxVal">-</span></div>
              <div class="tool-card-foot" id="torchRxFoot"></div></div>
            <div class="tool-card tool-card-tx"><div class="tool-card-label">Tx</div>
              <div class="tool-card-value"><span id="torchTxVal">-</span></div>
              <div class="tool-card-foot" id="torchTxFoot"></div></div>
            <div class="tool-card tool-card-text"><div class="tool-card-label">Top protocol</div>
              <div class="tool-card-value"><span id="torchProtoVal">-</span></div>
              <div class="tool-card-foot" id="torchProtoFoot"></div></div>
            <div class="tool-card"><div class="tool-card-label">Flows</div>
              <div class="tool-card-value"><span id="torchFlowsVal">-</span></div>
              <div class="tool-card-foot" id="torchFlowsFoot"></div></div>
            <div class="tool-card tool-card-text"><div class="tool-card-label">Top talker</div>
              <div class="tool-card-value"><span id="torchTalkerVal">-</span></div>
              <div class="tool-card-foot" id="torchTalkerFoot"></div></div>
          </div>
          <div id="torchSummary" class="muted-note mb-2"></div>
          <div class="tool-panel">
            <div class="data-scroll" id="torchScroll">
              <table class="table table-vcenter mb-0">
                <thead><tr><th>Protocol</th><th>Source</th><th>Destination</th><th>Rx</th><th>Tx</th></tr></thead>
                <tbody id="torchRows"><tr><td colspan="5" class="empty-state">Not run yet</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
