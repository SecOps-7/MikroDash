  <div class="page-view" id="page-vpn">
    <div class="container-fluid px-0" style="width:100%">
      <!-- The VPN page is an OVERVIEW now, not a WireGuard page wearing the
           wrong name. Its tiles counted WireGuard peers only and its main
           content was a WireGuard peer grid; both moved to /wireguard when that
           page landed, beside the dedicated OpenVPN and IPsec pages. What is
           left is the one view none of those can give: every VPN technology at
           once, with a way through to each. -->
      <div class="card">
        <div class="card-header d-flex align-items-center gap-2">
          <h3 class="card-title">VPN</h3><span id="vpnOverviewCount" class="card-badge">0</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-vcenter mb-0">
              <thead><tr><th>Technology</th><th>Configured</th><th>Active</th><th>Status</th><th></th></tr></thead>
              <tbody id="vpnOverviewTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- WHAT IS ACTUALLY CONNECTED, across every technology at once. The
           dedicated pages each manage one protocol and show its configuration;
           nothing else in the app answers "who is on the VPN right now". Built
           from the same `vpn:update` the table above uses, so it costs the
           router nothing. -->
      <div class="card">
        <div class="card-header d-flex align-items-center gap-2">
          <h3 class="card-title">Live Connections</h3><span id="vpnLiveCount" class="card-badge">0</span>
        </div>
        <div class="card-body" style="padding:.65rem .75rem">
          <div class="vpn-tile-grid" id="vpnLiveGrid"></div>
        </div>
      </div>

      <!-- PPP sessions (L2TP / PPTP / SSTP / OpenVPN). Hidden unless the router
           actually has sessions, so a WireGuard-only setup is unchanged. -->
      <div class="card" id="vpnPppCard" style="display:none">
        <div class="card-header d-flex align-items-center gap-2"><h3 class="card-title">PPP Sessions</h3><span id="vpnPppCount" class="card-badge">0</span></div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-vcenter mb-0">
              <thead><tr><th>User</th><th>Service</th><th>Address</th><th>Caller ID</th><th>Uptime</th><th style="text-align:right">RX / TX</th></tr></thead>
              <tbody id="vpnPppTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- IPsec peers, joined to their installed SAs for the negotiated ciphers. -->
      <div class="card" id="vpnIpsecCard" style="display:none">
        <div class="card-header d-flex align-items-center gap-2"><h3 class="card-title">IPsec Peers</h3><span id="vpnIpsecCount" class="card-badge">0</span></div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-vcenter mb-0">
              <thead><tr><th>Peer</th><th>State</th><th>Side</th><th>Uptime</th><th>Encryption</th><th>Authentication</th></tr></thead>
              <tbody id="vpnIpsecTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
