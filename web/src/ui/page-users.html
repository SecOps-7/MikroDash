  <div class="page-view" id="page-users">
    <div class="container-fluid px-0" style="width:100%">

      <div class="wl-summary-row wl-summary-row-4">
        <div class="wl-summary-card"><div class="wl-summary-title">Users</div><div class="fa-stat-val" id="ruSumUsers">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Groups</div><div class="fa-stat-val" id="ruSumGroups">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">Active Sessions</div><div class="fa-stat-val" id="ruSumSessions">&mdash;</div></div>
        <div class="wl-summary-card"><div class="wl-summary-title">MikroDash Connects As</div><div class="fa-stat-val" id="ruSumSelf" style="font-size:1.1rem">&mdash;</div></div>
      </div>

      <!-- A banner, not a silent empty table. The documented monitoring group
           denies `policy`, and RouterOS gates /user behind it, so "this router
           will not tell us" is the common case and needs to say so. -->
      <div class="card" id="ruNoticeCard" style="display:none">
        <div class="card-body" id="ruNotice" style="font-size:.82rem"></div>
      </div>

      <div class="card" id="rosusersCard">
        <div class="stale-overlay">&#9679; stale</div>
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="stab-bar brtab-bar" id="ruTabBar" role="tablist" aria-label="Router user tables">
            <button class="stab active" data-rutab="users" role="tab" aria-selected="true"
                    aria-controls="rutab-users" id="ruTabBtn-users">Users
              <span id="ruUserBadge" class="card-badge">0</span></button>
            <button class="stab" data-rutab="groups" role="tab" aria-selected="false"
                    aria-controls="rutab-groups" id="ruTabBtn-groups">Groups
              <span id="ruGroupBadge" class="card-badge">0</span></button>
            <button class="stab" data-rutab="sessions" role="tab" aria-selected="false"
                    aria-controls="rutab-sessions" id="ruTabBtn-sessions">Sessions
              <span id="ruSessionBadge" class="card-badge">0</span></button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span id="ruActionNote" class="muted-note"></span>
            <input id="ruSearch" class="form-control form-control-sm"
                   placeholder="Search&hellip;" style="flex:0 1 220px;width:220px"/>
            <!-- The resource engine fills this with the Add button for the table on
                 screen; rosusers.ts re-points it when the tab changes. -->
            <span id="ruAddSlot" data-res-add="rosUser"></span>
          </div>
        </div>
        <div class="card-body p-0">

          <div class="brtab-panel active" id="rutab-users" role="tabpanel" aria-labelledby="ruTabBtn-users">
            <div class="data-scroll" style="max-height:calc(100vh - 420px);overflow-y:auto">
              <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:900px">
                <colgroup><col style="width:20%"><col style="width:15%"><col style="width:15%">
                          <col style="width:17%"><col style="width:13%"><col style="width:20%"></colgroup>
                <thead><tr id="ruUserThead"></tr></thead>
                <tbody id="ruUserTable" data-res-rows="rosUser">
                  <tr><td colspan="6" class="empty-state">Waiting for user data&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="brtab-panel" id="rutab-groups" role="tabpanel" aria-labelledby="ruTabBtn-groups">
            <div class="data-scroll" style="max-height:calc(100vh - 420px);overflow-y:auto">
              <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:900px">
                <colgroup><col style="width:18%"><col style="width:44%"><col style="width:9%"><col style="width:29%"></colgroup>
                <thead><tr id="ruGroupThead"></tr></thead>
                <tbody id="ruGroupTable" data-res-rows="rosGroup">
                  <tr><td colspan="4" class="empty-state">Waiting for group data&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="brtab-panel" id="rutab-sessions" role="tabpanel" aria-labelledby="ruTabBtn-sessions">
            <div class="data-scroll" style="max-height:calc(100vh - 420px);overflow-y:auto">
              <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:820px">
                <colgroup><col style="width:20%"><col style="width:20%"><col style="width:13%">
                          <col style="width:16%"><col style="width:16%"><col style="width:15%"></colgroup>
                <thead><tr id="ruSessionThead"></tr></thead>
                <tbody id="ruSessionTable">
                  <tr><td colspan="6" class="empty-state">Waiting for session data&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
