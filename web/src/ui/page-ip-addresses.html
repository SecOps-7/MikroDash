  <div class="page-view" id="page-ip-addresses">
    <div class="container-fluid px-0" style="width:100%">
      <div class="card" id="ipAddressesCard">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">IP Addresses</h3>
            <span id="ipAddressesBadge" class="card-badge">0</span>
          </div>
          <div class="hdr-actions">
            <span data-res-add="ipAddress,ipv6Address"></span>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="data-scroll" style="max-height:640px;overflow-y:auto">
            <table class="table table-vcenter mb-0">
              <thead><tr><th>Address</th><th style="width:70px">Family</th><th>Network</th><th>Interface</th><th>State</th><th>Comment</th></tr></thead>
              <!-- A ROW-LEVEL data-res wins over this one: an IPv6 row edits
                   /ipv6/address through ipv6Address, the way Routes does it. -->
              <tbody id="ipAddressesTable" data-res-rows="ipAddress">
                <tr><td colspan="6" class="empty-state">Waiting for addresses&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
