  <div class="page-view" id="page-connections">
    <div class="container-fluid px-0" style="width:100%">
      <!-- conn-main: a size container, so the List tab can take the Map tab's
           height from the card's width (app.css). -->
      <div class="card conn-main">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Connections</h3>
            <span id="connMapBadge" class="card-badge" title="Connections on the router">0</span>
            <span id="connTabs" class="stab-bar rttab-bar" role="tablist">
              <button class="stab active" type="button" role="tab" aria-selected="true" data-conntab="map">Connections Map</button>
              <button class="stab" type="button" role="tab" aria-selected="false" data-conntab="list">Connections List</button>
            </span>
          </div>
          <div class="hdr-actions d-flex align-items-center gap-2">
            <input id="connListSearch" class="sform-input sform-sm" type="search" placeholder="Search connections"
              aria-label="Search connections" autocomplete="off" hidden>
            <select id="connSrcFilter" class="sform-input sform-sm" style="width:auto;min-width:160px" title="Filter by Client">
              <option value="">All Clients</option>
            </select>
          </div>
        </div>
        <div class="card-body" id="connPanelList" hidden>
          <div class="conn-list-bar">
            <span class="conn-sub" id="connListStatus">Waiting for the connection table…</span>
            <div class="conn-pager" id="connListPager"></div>
          </div>
          <div class="conn-scroll" id="connListScroll">
            <table class="table conn-table">
              <thead><tr id="connListHead"></tr></thead>
              <tbody id="connListBody"></tbody>
            </table>
          </div>
        </div>
        <div class="card-body" id="connPanelMap" style="padding:.5rem">
          <div id="worldMapWrap" style="width:100%;position:relative;overflow:hidden;border-radius:6px;background:rgb(from var(--accent-rx) r g b / .03);cursor:grab;user-select:none">
            <svg id="worldMap" viewBox="0 0 1000 500" style="width:100%;display:block;touch-action:none"></svg>
            <div class="map-tooltip" id="mapTooltip"></div>
            <!-- Flow direction for the comets on the lines below. Rx runs each
                 dot back toward this router's country (green). Tx runs it
                 outward (red). Both draws one of each. The page remembers the
                 choice and passes it into every redraw, including a country
                 filter. It sits in the map panel, so the List tab does not
                 show it. -->
            <select id="connFlowDir" class="sform-input sform-sm map-flow-dir" title="Rx travels toward this router (green). Tx travels away from it (red)." aria-label="Flow direction">
              <option value="rx">Rx</option>
              <option value="tx">Tx</option>
              <option value="both" selected>Both</option>
            </select>
            <div style="position:absolute;bottom:.5rem;right:.5rem;display:flex;flex-direction:column;gap:3px;z-index:2">
              <button id="mapZoomReset" class="icon-btn" type="button" title="Reset zoom">&#8634;</button>
              <button id="mapZoomIn" class="icon-btn" type="button" title="Zoom in">+</button>
              <button id="mapZoomOut" class="icon-btn" type="button" title="Zoom out">−</button>
              <button id="mapFullscreenBtn" class="icon-btn" type="button" title="Fullscreen map"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="conn-bottom-grid">
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h3 class="card-title">Top Countries</h3>
            <span id="connFilterLabel" style="font-family:var(--font-mono);font-size:.65rem;color:var(--accent-rx);display:none">● filtered</span>
          </div>
          <div class="card-body" style="padding:.5rem .75rem">
            <div id="connMapList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:.35rem"></div>
          </div>
        </div>
      </div>
      <!-- Connection Flow + Top Ports -->
      <div class="conn-sankey-grid">
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h3 class="card-title">Connection Flow</h3>
            <span style="font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted)">Sources → Destinations</span>
          </div>
          <div class="card-body" style="padding:.6rem .75rem">
            <div class="sankey-wrap">
              <div id="sankeyEmpty">Waiting for connection data…</div>
              <svg id="sankeySvg"></svg>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3 class="card-title">Top Ports</h3></div>
          <div class="card-body" style="padding:.35rem .6rem">
            <div id="connPortList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
