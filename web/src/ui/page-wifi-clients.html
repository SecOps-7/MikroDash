  <div class="page-view" id="page-wifi-clients">
    <div class="container-fluid px-0" style="width:100%">

      <!-- Summary row: WiFi SSIDs + Signal Health + Band Split, equal thirds -->
      <div class="wl-summary-row">
        <div class="wl-summary-card">
          <div class="wl-summary-title">WiFi SSIDs</div>
          <div class="wl-ssid-list" id="wlSsidList">
            <div class="wl-ssid-empty">Loading…</div>
          </div>
        </div>
        <div class="wl-summary-card">
          <div class="wl-summary-title">Signal Health</div>
          <div id="wlSigHealth">
            <div class="wl-sig-row"><span class="wl-sig-tier" style="color:rgb(from var(--accent-tx) r g b / .9)">Excellent</span><div class="wl-sig-bar-wrap"><div class="wl-sig-bar" id="wlSigBarE" style="width:0%;background:rgb(from var(--accent-tx) r g b / .7)"></div></div><span class="wl-sig-count" id="wlSigCntE">0</span></div>
            <div class="wl-sig-row"><span class="wl-sig-tier" style="color:rgb(from var(--accent-rx) r g b / .9)">Good</span><div class="wl-sig-bar-wrap"><div class="wl-sig-bar" id="wlSigBarG" style="width:0%;background:rgb(from var(--accent-rx) r g b / .7)"></div></div><span class="wl-sig-count" id="wlSigCntG">0</span></div>
            <div class="wl-sig-row"><span class="wl-sig-tier" style="color:rgb(from var(--accent-warn) r g b / .9)">Fair</span><div class="wl-sig-bar-wrap"><div class="wl-sig-bar" id="wlSigBarF" style="width:0%;background:rgb(from var(--accent-warn) r g b / .7)"></div></div><span class="wl-sig-count" id="wlSigCntF">0</span></div>
            <div class="wl-sig-row"><span class="wl-sig-tier" style="color:rgb(from var(--accent-err) r g b / .9)">Poor</span><div class="wl-sig-bar-wrap"><div class="wl-sig-bar" id="wlSigBarP" style="width:0%;background:rgb(from var(--accent-err) r g b / .7)"></div></div><span class="wl-sig-count" id="wlSigCntP">0</span></div>
          </div>
        </div>
        <div class="wl-summary-card" style="display:flex;flex-direction:column;justify-content:center">
          <div class="wl-summary-title">Band Split</div>
          <div class="wl-band-grid" id="wlBandGrid">
            <div class="wl-band-item">
              <span class="pill pill-alt">2.4 GHz</span>
              <span class="wl-band-num" id="wlBandNum24" style="color:rgb(from var(--accent-alt) r g b / .9)">0</span>
            </div>
            <div class="wl-band-item">
              <span class="pill pill-rx">5 GHz</span>
              <span class="wl-band-num" id="wlBandNum5" style="color:var(--accent-rx)">0</span>
            </div>
            <div class="wl-band-item" id="wlBandRow6" style="display:none">
              <span class="pill pill-tx">6 GHz</span>
              <span class="wl-band-num" id="wlBandNum6" style="color:rgb(from var(--accent-tx) r g b / .9)">0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card" id="wirelessCard">
        <div class="stale-overlay">&#9679; stale</div>
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <h3 class="card-title mb-0">Wifi Clients</h3>
          <span id="wirelessTabBadge" class="card-badge">0</span>
          <div class="d-flex align-items-center gap-2 ms-auto flex-wrap">
            <span style="font-size:.7rem;color:var(--text-muted)">Sort:</span>
            <div class="d-flex gap-1" id="wifiSortBtns">
              <button class="wl-sort-btn active" data-sort="signal">Signal</button>
              <button class="wl-sort-btn" data-sort="txRate">TX Rate</button>
              <button class="wl-sort-btn" data-sort="uptime">Uptime</button>
              <button class="wl-sort-btn" data-sort="name">Name</button>
              <!-- IP has no column of its own: the address is rendered under the
                   device name, so there is no header to click and the button is
                   the only way to ask for it. -->
              <button class="wl-sort-btn" data-sort="ip">IP</button>
            </div>
            <!-- The label IS the state, so the button says what the table is
                 doing rather than what pressing it would do. wireless.ts rewrites
                 it; this is the pre-render value and matches the default. -->
            <button class="wl-sort-btn active" id="wlGroupBtn" type="button" aria-pressed="true"
                    title="Group the table by access point, or list every client flat"
              >Grouped by AP</button>
            <button class="wl-sort-btn fa-open-btn" id="faOpenBtn" type="button"
                    title="Scan the RF environment - interrupts clients on the chosen radio"
                    style="display:none">&#9678; Frequency Analyzer</button>
          </div>
        </div>
        <div class="card-body p-0" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table class="table table-vcenter mb-0" style="table-layout:fixed;width:100%;min-width:520px">
            <colgroup><col style="width:170px"><col style="width:80px"><col style="width:72px"><col style="width:86px"><col style="width:96px"><col style="width:110px"><col style="width:70px"><col style="width:70px"></colgroup>
            <!-- id required by _renderSortHeader, which rewrites this row to add
                 sort indicators and click handlers. The static contents are the
                 pre-render fallback and must match renderWireless()'s column list. -->
            <thead><tr id="wlThead"><th>Device</th><th class="wl-col-iface">Interface</th><th>Band</th><th>Standard</th><th>Security</th><th class="text-end">Signal</th><th>TX / RX</th><th class="wl-col-uptime">Uptime</th></tr></thead>
            <tbody id="wirelessTable"><tr><td colspan="8" class="empty-state">No wireless clients</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Settings -> Features: whether this router's clients are recorded, and a client's history
           (wifi-clients-features.ts). -->
      <div class="card" id="wlRecCard" style="margin-top:.85rem;display:none">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <h3 class="card-title mb-0">Client history</h3>
          <div class="hdr-actions">
            <span class="muted-note" id="wlRecNote"></span>
            <button class="sbtn sbtn-outline is-sm" id="wlRecToggle" type="button"
                    title="Write this router's clients to the history once a minute, and keep reading its Wi-Fi while nobody has it open">Record this router</button>
          </div>
        </div>
      </div>
      <div class="card" id="wlHistCard" style="margin-top:.85rem;display:none">
        <div class="card-header d-flex align-items-center justify-content-between gap-2">
          <h3 class="card-title mb-0" id="wlHistTitle">History</h3>
          <div class="hdr-actions">
            <select class="sform-input sform-sm" id="wlHistRange" style="width:120px;flex:0 0 auto" aria-label="Range">
              <option value="6">6 hours</option>
              <option value="24" selected>24 hours</option>
              <option value="168">7 days</option>
            </select>
            <button class="sbtn sbtn-outline is-sm" id="wlHistClose" type="button">Close</button>
          </div>
        </div>
        <div class="card-body" id="wlHistBody"></div>
      </div>

      <!-- Settings -> Features: the watch list (internal/server/clients_api.go). -->
      <div class="card" id="wlWatchCard" style="margin-top:.85rem;display:none">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Watch list</h3>
            <span id="wlWatchBadge" class="card-badge active-blue">0</span>
          </div>
          <div class="hdr-actions">
            <span class="muted-note" id="wlWatchNote"></span>
            <input class="sform-input sform-sm" id="wlWatchMac" placeholder="AA:BB:CC:DD:EE:FF" style="width:150px;flex:0 0 auto" autocomplete="off" aria-label="MAC address">
            <input class="sform-input sform-sm" id="wlWatchLabel" placeholder="label" style="width:130px;flex:0 0 auto" autocomplete="off" aria-label="Label">
            <input class="sform-input sform-sm" id="wlWatchGrace" type="number" min="1" max="1440" value="10"
                   title="Minutes it may be gone before the alert" style="width:80px;flex:0 0 auto" aria-label="Grace minutes">
            <button class="sbtn sbtn-outline is-sm" id="wlWatchAdd" type="button" title="Watch a device by its MAC, Wi-Fi or wired">Watch</button>
          </div>
        </div>
        <div class="card-body p-0">
          <table class="table table-vcenter mb-0" style="width:100%">
            <thead><tr id="wlWatchThead"></tr></thead>
            <tbody id="wlWatchTable"><tr><td colspan="5" class="empty-state">Nothing watched.</td></tr></tbody>
          </table>
          <div class="muted-note" id="wlWatchHint" style="display:none;padding:.5rem .85rem"></div>
        </div>
      </div>
    </div>
  </div>
