  <!-- The Tools page: diagnostics run on the selected router, each within fixed
       bounds. Rendered by web/src/pages/tools.ts; the bounds are internal/diag's. -->
  <div class="page-view" id="page-tools">
    <div class="container-fluid px-0" style="width:100%">
      <div class="card" id="toolsCard">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Tools</h3>
          </div>
          <div class="hdr-actions d-flex align-items-center gap-2">
            <span id="toolsTabs" class="stab-bar brtab-bar" role="tablist">
              <button class="stab active" type="button" role="tab" aria-selected="true" data-tooltab="ping">Ping</button>
              <button class="stab" type="button" role="tab" aria-selected="false" data-tooltab="traceroute">Traceroute</button>
              <button class="stab" type="button" role="tab" aria-selected="false" data-tooltab="torch">Torch</button>
              <button class="stab" type="button" role="tab" aria-selected="false" data-tooltab="btest">Bandwidth test</button>
            </span>
          </div>
        </div>
        <div class="card-body" id="toolsBody">
          <div class="tool-panel" id="toolPanel-ping">
            <form class="d-flex align-items-end flex-wrap gap-2 mb-3" id="pingForm">
              <div>
                <label class="form-label" for="pingAddress">Address</label>
                <input class="form-control form-control-sm" id="pingAddress" type="text" maxlength="253"
                  placeholder="IP address, host name or MAC" autocomplete="off" spellcheck="false" required>
              </div>
              <div>
                <label class="form-label" for="pingCount">Packets</label>
                <select class="form-select form-select-sm" id="pingCount">
                  <option>1</option><option>2</option><option>3</option><option selected>4</option>
                  <option>5</option><option>6</option><option>7</option><option>8</option>
                  <option>9</option><option>10</option>
                </select>
              </div>
              <button class="sbtn sbtn-primary" id="pingRun" type="submit">Ping</button>
              <span class="muted-note" id="pingStatus"></span>
            </form>
            <div id="pingSummary" class="muted-note mb-2"></div>
            <div class="data-scroll">
              <table class="table table-vcenter mb-0">
                <thead><tr><th>Seq</th><th>Host</th><th>Time</th><th>TTL</th><th>Size</th><th>Status</th></tr></thead>
                <tbody id="pingRows"><tr><td colspan="6" class="empty-state">Not run yet</td></tr></tbody>
              </table>
            </div>
          </div>
          <div class="tool-panel" id="toolPanel-traceroute" style="display:none">
            <form class="d-flex align-items-end flex-wrap gap-2 mb-3" id="traceForm">
              <div>
                <label class="form-label" for="traceAddress">Address</label>
                <input class="form-control form-control-sm" id="traceAddress" type="text" maxlength="253"
                  placeholder="IP address or host name" autocomplete="off" spellcheck="false" required>
              </div>
              <div>
                <label class="form-label" for="traceHops">Max hops</label>
                <select class="form-select form-select-sm" id="traceHops">
                  <option>5</option><option>10</option><option selected>15</option>
                  <option>20</option><option>25</option><option>30</option>
                </select>
              </div>
              <button class="sbtn sbtn-primary" id="traceRun" type="submit">Trace</button>
              <span class="muted-note" id="traceStatus"></span>
            </form>
            <div id="traceSummary" class="muted-note mb-2"></div>
            <div class="data-scroll">
              <table class="table table-vcenter mb-0">
                <thead><tr><th>Hop</th><th>Address</th><th>Loss</th><th>Last</th><th>Best</th><th>Worst</th><th>Status</th></tr></thead>
                <tbody id="traceRows"><tr><td colspan="7" class="empty-state">Not run yet</td></tr></tbody>
              </table>
            </div>
          </div>
          <div class="tool-panel" id="toolPanel-torch" style="display:none">
            <form class="d-flex align-items-end flex-wrap gap-2 mb-3" id="torchForm">
              <div>
                <label class="form-label" for="torchInterface">Interface</label>
                <select class="form-select form-select-sm" id="torchInterface" required></select>
              </div>
              <div>
                <label class="form-label" for="torchSeconds">Seconds</label>
                <select class="form-select form-select-sm" id="torchSeconds">
                  <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
                  <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                </select>
              </div>
              <button class="sbtn sbtn-primary" id="torchRun" type="submit">Watch</button>
              <span class="muted-note" id="torchStatus"></span>
            </form>
            <div id="torchSummary" class="muted-note mb-2"></div>
            <div class="data-scroll">
              <table class="table table-vcenter mb-0">
                <thead><tr><th>Protocol</th><th>Source</th><th>Destination</th><th>Rx</th><th>Tx</th></tr></thead>
                <tbody id="torchRows"><tr><td colspan="5" class="empty-state">Not run yet</td></tr></tbody>
              </table>
            </div>
          </div>
          <!-- The password is typed for each run and cleared when the run is
               sent: it is never stored, and nothing on this page echoes it. -->
          <div class="tool-panel" id="toolPanel-btest" style="display:none">
            <form class="d-flex align-items-end flex-wrap gap-2 mb-3" id="btestForm" autocomplete="off">
              <div>
                <label class="form-label" for="btestAddress">Server</label>
                <input class="form-control form-control-sm" id="btestAddress" type="text" maxlength="253"
                  placeholder="Another MikroTik's address" autocomplete="off" spellcheck="false" required>
              </div>
              <div>
                <label class="form-label" for="btestUser">User</label>
                <input class="form-control form-control-sm" id="btestUser" type="text" maxlength="64"
                  autocomplete="off" spellcheck="false">
              </div>
              <div>
                <label class="form-label" for="btestPassword">Password</label>
                <input class="form-control form-control-sm" id="btestPassword" type="password" autocomplete="new-password">
              </div>
              <div>
                <label class="form-label" for="btestSeconds">Seconds</label>
                <select class="form-select form-select-sm" id="btestSeconds">
                  <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
                  <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                </select>
              </div>
              <div>
                <label class="form-label" for="btestProtocol">Protocol</label>
                <select class="form-select form-select-sm" id="btestProtocol">
                  <option selected>tcp</option><option>udp</option>
                </select>
              </div>
              <div>
                <label class="form-label" for="btestDirection">Direction</label>
                <select class="form-select form-select-sm" id="btestDirection">
                  <option selected>both</option><option>receive</option><option>transmit</option>
                </select>
              </div>
              <button class="sbtn sbtn-primary" id="btestRun" type="submit">Test</button>
              <span class="muted-note" id="btestStatus"></span>
            </form>
            <div id="btestSummary" class="muted-note mb-2"></div>
            <div class="data-scroll">
              <table class="table table-vcenter mb-0">
                <tbody id="btestRows"><tr><td colspan="2" class="empty-state">Not run yet</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
