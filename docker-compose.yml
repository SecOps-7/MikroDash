# The project name and the volume name are load-bearing.
#
# `name: mikrodash` + `volumes: data` is what produces the volume `mikrodash_data`,
# which holds every history sample, alert row and audit row this install has ever
# written, plus the encrypted settings and the user store. Renaming either would
# silently start a brand new empty volume and look like total data loss.
name: mikrodash

services:
  mikrodash:
    build: .
    image: mikrodash-go
    # NAMED FOR THE PRODUCT, not the language. It was `mikrodash-go` only to tell
    # it apart from the Node container during coexistence, and that ended at the
    # v0.8.0 cutover. The project name above stays `mikrodash`, so the data volume
    # is still `mikrodash_data` and a rename cannot orphan it.
    container_name: MikroDash
    ports:
      - "3081:3081"
    volumes:
      - data:/data
    restart: unless-stopped
    # The flags are baked into the image's CMD; they are repeated here so the
    # deployed configuration is readable without inspecting the image.
    #
    # `-node=` is EMPTY on purpose and must stay that way. It names a Node
    # MikroDash to proxy un-ported routes to, and it defaulted to
    # http://127.0.0.1:3081 during the migration. At cutover that made the app
    # proxy every such route TO ITSELF, and silently disabled the background pool
    # and the retention sweep, because both are gated on "standalone" meaning no
    # -node. Three subsystems wrong from one stale default.
    command:
      - -listen=:3081
      - -node=
      - -data=/data
      - -web=/app/web/dist
      - -static=/app/web/public
      - -history
      - -backup-scheduler
      - -retention
      - -alert-dispatch
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
