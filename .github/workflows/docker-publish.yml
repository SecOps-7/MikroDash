name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase — Docker registry names are case-sensitive
  IMAGE_NAME: secops-7/mikrodash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU lets the runner execute non-amd64 instructions via emulation.
      #
      # linux/arm/v7 IS BACK as of v0.8.0. It was dropped at the Node 24 move
      # because node:24-alpine published no 32-bit ARM variant (amd64, arm64/v8
      # and s390x only), which stranded ARMv7 users on 0.5.54 — and restoring it
      # was one of the stated motives for the Go rewrite. The runtime is now
      # alpine with a CGO_ENABLED=0 static binary, and Go cross-compiles, so the
      # constraint that removed it no longer exists.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      # Buildx is the Docker CLI plugin that drives multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only version tags produce published images: v0.5.21 pushes :0.5.21,
      # :0.5 and :latest. A push to main builds but publishes nothing, so
      # :latest always points at the newest release rather than at whatever was
      # merged most recently.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Main pushes still build every architecture, they just do not publish.
      # The old reason was that better-sqlite3 compiled natively per arch, so an
      # arm64 break was a real possibility; modernc.org/sqlite is pure Go and
      # there is no native compilation left. What can still break per-arch is the
      # geodata stage's download and the QEMU emulation itself, so building all
      # three on main remains worth the minutes.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in the registry so repeat builds are fast.
          # Reading is always safe; writing is restricted to tag builds so a
          # validation run never writes to the registry. Two concurrent writers
          # of the same layers is what tripped GHCR's secondary rate limit and
          # blocked the v0.5.54 publish.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

  # Create a GitHub Release on version tags, using the matching CHANGELOG section
  # as the release body. Only runs after the Docker image is successfully published.
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract description from the CHANGELOG header line, e.g. "CAPsMAN support, ..."
          # Separator-tolerant on purpose: entries up to 0.7.33 use an em dash, 0.7.34 onward use a
          # plain hyphen because em dashes are not wanted in anything user-facing. A hard-coded " — "
          # here would silently yield an empty description for every future release, and the release
          # would publish with no title rather than fail.
          DESCRIPTION=$(grep "^## \[${VERSION}\]" CHANGELOG.md | head -1 \
            | sed -E "s/^## \[${VERSION}\][[:space:]]*[—–:-][[:space:]]*//")
          # Build release notes: description as a heading, then the section body
          {
            [ -n "$DESCRIPTION" ] && printf '## %s\n\n' "$DESCRIPTION"
            awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
