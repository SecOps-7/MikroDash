name: Tests

# Runs on every PR and on pushes to main.
#
# This used to build TWO images and run the suite inside one of them, because
# npm has a dev/prod dependency split: the runtime install was --omit=dev, so a
# test needing a dev-only tool did not fail there, it failed to LOAD and took its
# whole file with it. Go has no such split and the Dockerfile has no `test`
# stage, so the checks run directly and the image is built once, for the smoke
# test, which is the artefact users actually run.
#
# The gate sweep is the interesting half. `tools/verify.sh` discovers what to run
# by globbing rather than by reading a list, which is why it cannot forget a
# category, and it reports a SKIP as a skip rather than folding it into green.
# Since the 2026-08-31 cutover the 105 generator --check runs skip permanently:
# they regenerate FROM the Node implementation, and there is none.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # PINNED, AND NOT A WORKAROUND.
      #
      # Nine gates compare rendered HTML that contains local-time output -- an
      # uptime of "up 6h", a scheduled-run list, report period labels. Their
      # recordings were generated on a machine in Europe/Berlin, and a recording
      # carries the environment that produced it whether or not anyone wrote that
      # down. Run them under UTC and exactly those nine fail; run them under
      # Europe/Berlin and all 136 pass. Confirmed both ways on 2026-08-31, and
      # the first CI run after cutover is what surfaced it: until then the gates
      # had only ever run in one timezone.
      #
      # The right fix would be to make the gates timezone-independent and
      # re-record. That is no longer possible: the recordings derive from the
      # Node implementation, which was deleted at the v0.8.0 cutover, so they are
      # frozen as they are. Reproducing the environment they were made in is
      # therefore the only correct option, not the convenient one.
      #
      # If a gate is ever rewritten to be timezone-independent, this can go --
      # but check all nine, because removing it while one still renders local
      # time turns a deterministic pass into a silent regional failure.
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must match the Dockerfile. golang.org/x/crypto will not build on 1.23.
          go-version: '1.25'
          cache: true

      # gofmt is checked rather than applied: a formatting difference in a PR is
      # a review distraction, and `-l` names the files without touching them.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # Unit tests plus the differential gates that compare Go payloads against
      # the recorded Node ones, and the proplist drift gate. Both read committed
      # recordings, so neither needs the old implementation present.
      - name: go test
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Node is not a runtime dependency and never runs in production. It is
      # needed for exactly two development-time things: `tsc --noEmit`, which
      # emits nothing, and the ~300 gate and audit scripts, which bundle frontend
      # TypeScript through esbuild. Testing TypeScript needs a JavaScript
      # runtime, and that is not a dependency this repo can decide away.
      - name: Install frontend dev tooling
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      # The frontend has to exist before the gates run: several compare a built
      # bundle against a recorded renderer. This is the same builder the image
      # uses, so what CI checks is what ships.
      - name: Build frontend
        run: go run ./cmd/webbuild -dir web

      # --no-docker skips the twelve generators that need a container, and says
      # so loudly rather than counting them as passed.
      - name: Gate sweep
        run: sh tools/verify.sh --no-docker

      # amd64 only — this job verifies behaviour, not multi-arch packaging.
      # docker-publish.yml covers the other architectures on tagged releases.
      - name: Build image
        run: docker build -t mikrodash:ci .

      # Catches startup-only failures no unit test sees: a bad default, a missing
      # runtime package, a flag that stopped parsing. 503 with {"starting":true}
      # is a pass — no router is configured, so the app never reaches ready; we
      # assert only that it serves HTTP.
      - name: Smoke-test startup
        run: |
          cid=$(docker run -d --rm --tmpfs /data -p 3099:3081 \
            -e DATA_SECRET=ci-smoke-test mikrodash:ci)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3099/healthz || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Server responded with HTTP $code."
              docker logs "$cid"
              docker stop "$cid" > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Server did not respond within 40s:"
          docker logs "$cid"
          docker stop "$cid" > /dev/null
          exit 1
